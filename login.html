<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hardi Duct - تسجيل الدخول</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Segoe UI', Tahoma, sans-serif;
  background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}
.card {
  background: rgba(255,255,255,0.05);
  backdrop-filter: blur(20px);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 20px;
  padding: 40px;
  width: 90%;
  max-width: 400px;
  box-shadow: 0 25px 50px rgba(0,0,0,0.5);
}
.logo {
  text-align: center;
  margin-bottom: 30px;
}
.logo h1 {
  color: #e94560;
  font-size: 2rem;
  font-weight: 800;
  letter-spacing: 2px;
}
.logo p { color: #aaa; margin-top: 5px; }
.form-group { margin-bottom: 20px; }
label { color: #ccc; display: block; margin-bottom: 8px; font-size: 0.9rem; }
input {
  width: 100%;
  padding: 12px 16px;
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 10px;
  color: white;
  font-size: 1rem;
  outline: none;
  transition: border-color 0.3s;
}
input:focus { border-color: #e94560; }
input::placeholder { color: #666; }
button {
  width: 100%;
  padding: 14px;
  background: linear-gradient(135deg, #e94560, #c23152);
  border: none;
  border-radius: 10px;
  color: white;
  font-size: 1.1rem;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.2s, opacity 0.2s;
  margin-top: 10px;
}
button:hover { transform: translateY(-2px); opacity: 0.9; }
.error {
  color: #e94560;
  text-align: center;
  margin-top: 15px;
  font-size: 0.9rem;
  display: none;
}
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <h1>🏢 Hardi Duct</h1>
    <p>نظام إدارة العملاء والمبيعات</p>
  </div>
  <div class="form-group">
    <label>📧 الإيميل</label>
    <input type="email" id="email" placeholder="أدخل إيميلك">
  </div>
  <div class="form-group">
    <label>🔒 كلمة السر</label>
    <div style="position:relative">
<input type="password" id="password" placeholder="أدخل كلمة السر" style="width:100%;padding:12px 45px 12px 16px">
<span onclick="togglePass()" style="position:absolute;left:12px;top:50%;transform:translateY(-50%);cursor:pointer;font-size:1.2rem">👁️</span>
</div>
  </div>
  <button onclick="login()">دخول</button>
  <div class="error" id="error">❌ إيميل أو كلمة السر خاطئة!</div>
</div>
<script>
async function login() {
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  const res = await fetch('/login', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({email, password})
  });
  const data = await res.json();
  if (data.ok) {
    window.location.href = '/';
  } else {
    document.getElementById('error').style.display = 'block';
  }
}
document.addEventListener('keypress', e => { if (e.key === 'Enter') login(); });
</script>
</body>
</html>
