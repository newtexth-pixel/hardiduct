<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hardi Duct - تسجيل الدخول</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Segoe UI', Tahoma, sans-serif;
  background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}
.card {
  background: rgba(255,255,255,0.05);
  backdrop-filter: blur(20px);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 20px;
  padding: 40px;
  width: 90%;
  max-width: 400px;
  box-shadow: 0 25px 50px rgba(0,0,0,0.5);
}
.logo { text-align: center; margin-bottom: 30px; }
.logo h1 { color: #e94560; font-size: 2rem; font-weight: 800; }
.logo p { color: #aaa; margin-top: 5px; }
.form-group { margin-bottom: 20px; }
label { color: #ccc; display: block; margin-bottom: 8px; font-size: 0.9rem; }
.input-box {
  display: flex;
  align-items: center;
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 10px;
  overflow: hidden;
}
.input-box input {
  flex: 1;
  padding: 12px 16px;
  background: transparent;
  border: none;
  color: white;
  font-size: 1rem;
  outline: none;
}
.input-box input::placeholder { color: #666; }
.eye-btn {
  padding: 12px 14px;
  background: transparent;
  border: none;
  color: #aaa;
  font-size: 1.2rem;
  cursor: pointer;
}
.login-btn {
  width: 100%;
  padding: 14px;
  background: linear-gradient(135deg, #e94560, #c23152);
  border: none;
  border-radius: 10px;
  color: white;
  font-size: 1.1rem;
  font-weight: 700;
  cursor: pointer;
  margin-top: 10px;
}
.error { color: #e94560; text-align: center; margin-top: 15px; font-size: 0.9rem; display: none; }
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <h1>&#x1F3E2; Hardi Duct</h1>
    <p>&#x646;&#x638;&#x627;&#x645; &#x625;&#x62F;&#x627;&#x631;&#x629; &#x627;&#x644;&#x639;&#x645;&#x644;&#x627;&#x621; &#x648;&#x627;&#x644;&#x645;&#x628;&#x64A;&#x639;&#x627;&#x62A;</p>
  </div>
  <div class="form-group">
    <label>&#x1F4E7; &#x627;&#x644;&#x625;&#x64A;&#x645;&#x64A;&#x644;</label>
    <div class="input-box">
      <input type="email" id="email" placeholder="&#x623;&#x62F;&#x62E;&#x644; &#x625;&#x64A;&#x645;&#x64A;&#x644;&#x643;" autocomplete="off">
    </div>
  </div>
  <div class="form-group">
    <label>&#x1F512; &#x643;&#x644;&#x645;&#x629; &#x627;&#x644;&#x633;&#x631;</label>
    <div class="input-box">
      <input type="password" id="password" placeholder="&#x623;&#x62F;&#x62E;&#x644; &#x643;&#x644;&#x645;&#x629; &#x627;&#x644;&#x633;&#x631;" autocomplete="new-password">
      <button class="eye-btn" id="eyeBtn" type="button" onclick="togglePass()">&#x1F441;</button>
    </div>
  </div>
  <button class="login-btn" onclick="login()">&#x62F;&#x62E;&#x648;&#x644;</button>
  <div class="error" id="error">&#x274C; &#x625;&#x64A;&#x645;&#x64A;&#x644; &#x623;&#x648; &#x643;&#x644;&#x645;&#x629; &#x627;&#x644;&#x633;&#x631; &#x62E;&#x627;&#x637;&#x626;&#x629;!</div>
</div>
<script>
function togglePass() {
  var input = document.getElementById('password');
  var btn = document.getElementById('eyeBtn');
  if (input.type === 'password') {
    input.type = 'text';
    btn.innerHTML = '&#x1F648;';
  } else {
    input.type = 'password';
    btn.innerHTML = '&#x1F441;';
  }
}
async function login() {
  var email = document.getElementById('email').value;
  var password = document.getElementById('password').value;
  try {
    var res = await fetch('/login', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({email: email, password: password})
    });
    var data = await res.json();
    if (data.ok) {
      window.location.href = '/';
    } else {
      document.getElementById('error').style.display = 'block';
    }
  } catch(e) {
    document.getElementById('error').style.display = 'block';
  }
}
document.addEventListener('keypress', function(e) { if (e.key === 'Enter') login(); });
</script>
</body>
</html>
